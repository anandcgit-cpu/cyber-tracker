<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cyber Security Tracker</title>
<meta name="theme-color" content="#534AB7">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0eff5;color:#1a1a1f;min-height:100vh;padding:16px 12px 40px}
#app{max-width:720px;margin:0 auto}
.header{background:#fff;border-radius:16px;padding:20px;margin-bottom:12px;border:1px solid #e2e0ea;box-shadow:0 1px 4px #0000000a}
.header h1{font-size:18px;font-weight:700;letter-spacing:-.3px;margin-bottom:3px}
.header .sub{font-size:12px;color:#888;margin-bottom:14px}
.overall-prog{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.overall-prog .label{font-size:11px;color:#666;white-space:nowrap}
.bar-wrap{flex:1;background:#eee;border-radius:99px;height:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .4s}
.pct{font-size:11px;font-weight:700;min-width:30px;text-align:right}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:3px 10px;border-radius:8px;margin-bottom:8px;font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.phases{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ph-btn{padding:5px 12px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;border:2px solid transparent;background:#f0eff5;color:#555;transition:all .15s;white-space:nowrap}
.ph-btn.active{background:#fff}
.hero{border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid #e2e0ea;background:#fff}
.hero-label{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;opacity:.7}
.hero-name{font-size:17px;font-weight:700;margin-bottom:3px}
.hero-months{font-size:11px;color:#888;margin-bottom:10px}
.hero-goal{font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;display:inline-block}
.hero-prog{margin-top:12px}
.hero-prog .pl{font-size:10px;color:#888;margin-bottom:4px;display:flex;justify-content:space-between}
.weeks{display:flex;flex-direction:column;gap:7px}
.wk{border-radius:12px;overflow:hidden;border:1px solid #e2e0ea;background:#fff}
.wk-head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;cursor:pointer;user-select:none}
.wk-head:hover{background:#fafaf8}
.wk-num{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
.wk-title{font-size:13px;font-weight:600}
.wk-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.wk-prog-bar{width:70px;background:#eee;border-radius:99px;height:3px;overflow:hidden}
.wk-prog-fill{height:100%;border-radius:99px;transition:width .3s}
.wk-status{font-size:10px;color:#aaa}
.arrow{font-size:10px;color:#ccc;margin-left:8px;transition:transform .2s;display:inline-block}
.arrow.open{transform:rotate(180deg)}
.days{display:none}
.days.open{display:block}
.day-card{padding:12px 14px;border-top:1px solid #f0eff5}
.day-card.done-day{opacity:.5}
.day-card.today{background:#fffdf5;border-left:3px solid #f59e0b;padding-left:11px}
.day-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.day-date{font-size:12px;font-weight:700}
.today-tag{font-size:9px;font-weight:700;background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:99px;margin-left:5px;vertical-align:middle}
.mark-btn{font-size:10px;font-weight:600;padding:4px 12px;border-radius:99px;border:1.5px solid #ddd;background:#fff;cursor:pointer;color:#666;transition:all .15s}
.mark-btn:hover{background:#f5f5f5}
.mark-btn.done{background:#dcfce7;color:#166534;border-color:#86efac}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start}
.sbadge{font-size:9px;font-weight:700;padding:3px 0;border-radius:8px;text-align:center;letter-spacing:.2px;line-height:1.7;border:1px solid transparent}
.slot-title{font-size:11px;font-weight:600;margin-bottom:2px;line-height:1.35}
.slot-instr{font-size:10px;color:#777;line-height:1.45;margin-bottom:3px}
.slot-link{font-size:10px;font-weight:700;color:#185FA5;text-decoration:none}
.slot-link:hover{text-decoration:underline}
.day-footer{margin-top:8px;padding-top:6px;border-top:1px dashed #ebebeb;font-size:10px;color:#bbb;display:flex;gap:10px;flex-wrap:wrap}
@media(prefers-color-scheme:dark){
  body{background:#18181b;color:#e4e4e7}
  .header,.hero,.wk{background:#27272a;border-color:#3f3f46}
  .wk-head:hover{background:#2f2f32}
  .day-card{border-top-color:#3f3f46}
  .day-card.today{background:#2a2400;border-left-color:#f59e0b}
  .day-footer{border-top-color:#3f3f46}
  .bar-wrap,.wk-prog-bar{background:#3f3f46}
  .mark-btn{background:#27272a;border-color:#52525b;color:#a1a1aa}
  .mark-btn:hover{background:#3f3f46}
  .mark-btn.done{background:#14532d;color:#86efac;border-color:#166534}
  .ph-btn{background:#27272a;color:#a1a1aa}
  .ph-btn.active{background:#3f3f46}
  .slot-instr{color:#a1a1aa}
  .slot-link{color:#60a5fa}
  h1{color:#f4f4f5}
  .header .sub{color:#71717a}
  .wk-status,.wk-num{color:#71717a}
  .hero-months{color:#71717a}
}
@media(max-width:480px){
  body{padding:10px 8px 30px}
  .slot{grid-template-columns:56px 1fr}
}
</style>
</head>
<body>
<div id="app"><div style="padding:50px;text-align:center;color:#888;font-size:14px">Loading your 240-day tracker…</div></div>

<script src="p1.js"></script>
<script src="p2.js"></script>
<script src="p3.js"></script>
<script src="p4.js"></script>
<script src="p5.js"></script>
<script src="p6.js"></script>

<script>
const SU = 'https://script.google.com/macros/s/AKfycbw2k1uuZ152jDmmGRzs6mw0fTFs6GBmxNjB-NnrGb2-v1jLN66kLr-_EoGY_C9QYwWh/exec';
const LS  = 'cy6';

var done  = JSON.parse(localStorage.getItem(LS)||'{}');
var curPh = 0;
var openW = {};
var synSt = 'idle';

function jsonp(url){
  return new Promise(function(res,rej){
    var cb='_cb'+Date.now(), s=document.createElement('script');
    var t=setTimeout(function(){rej();delete window[cb];s.remove();},7000);
    window[cb]=function(d){clearTimeout(t);res(d);delete window[cb];s.remove();};
    s.onerror=function(){clearTimeout(t);rej();delete window[cb];};
    s.src=url+(url.indexOf('?')>=0?'&':'?')+'callback='+cb;
    document.head.appendChild(s);
  });
}

function tog(pi,wi,di,e){
  e.stopPropagation();
  var k=pi+'_'+wi+'_'+di;
  done[k]=!done[k];
  localStorage.setItem(LS,JSON.stringify(done));
  synSt='saving'; draw();
  jsonp(SU+'?action=set&key='+encodeURIComponent(k)+'&done='+done[k])
    .then(function(){synSt='ok';draw();})
    .catch(function(){synSt='err';draw();});
}

function togW(key){openW[key]=!openW[key];draw();}

function todayStr(){
  return new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

function hexRgb(h){
  return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);
}

function draw(){
  var PH=window.PH;
  if(!PH||!PH.length){
    document.getElementById('app').innerHTML='<div style="padding:30px;color:#dc2626;font-size:13px;text-align:center">Error: data files not loaded.<br>Check p1.js – p6.js are in your GitHub repo and try a hard refresh (Ctrl+Shift+R).</div>';
    return;
  }

  var ph  = PH[curPh];
  var col = ph.c;
  var rgb = hexRgb(col);

  // overall progress
  var tot=0, dn=0;
  PH.forEach(function(p){p.w.forEach(function(w){tot+=w.d.length;});});
  for(var k in done){if(done[k])dn++;}
  var pct=tot?Math.round(dn/tot*100):0;

  // phase progress
  var phTot=0, phDn=0;
  ph.w.forEach(function(w,wi){
    phTot+=w.d.length;
    w.d.forEach(function(_,di){if(done[curPh+'_'+wi+'_'+di])phDn++;});
  });
  var phPct=phTot?Math.round(phDn/phTot*100):0;

  // sync ui
  var SM={
    idle:  {bg:'transparent',col:'#999',dot:'#ccc',txt:''},
    saving:{bg:'#fef3c7',col:'#92400e',dot:'#f59e0b',txt:'Saving…'},
    ok:    {bg:'#dcfce7',col:'#166534',dot:'#22c55e',txt:'✓ Synced to Google Sheets'},
    err:   {bg:'#fee2e2',col:'#991b1b',dot:'#ef4444',txt:'Saved locally (offline)'}
  };
  var sm=SM[synSt];
  var today=todayStr();

  var h='';

  // header
  h+='<div class="header">';
  h+='<h1>Cybersecurity Analyst — 12-Month Plan</h1>';
  h+='<div class="sub">Mon–Fri · 90 min/day · Watch → Read → Lab → Notes · 100% Free · 240 Days</div>';
  if(sm.txt) h+='<div class="sync" style="background:'+sm.bg+';color:'+sm.col+'"><span class="dot" style="background:'+sm.dot+'"></span>'+sm.txt+'</div>';
  h+='<div class="overall-prog">';
  h+='<span class="label">'+dn+' / '+tot+' days complete</span>';
  h+='<div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div>';
  h+='<span class="pct" style="color:'+col+'">'+pct+'%</span>';
  h+='</div></div>';

  // phase tabs
  h+='<div class="phases">';
  PH.forEach(function(p,i){
    var act=i===curPh;
    h+='<span class="ph-btn'+(act?' active':'')+'" style="'+(act?'border-color:'+p.c+';color:'+p.c:'')+';" onclick="curPh='+i+';openW={};draw()">'+p.l+': '+p.n+'</span>';
  });
  h+='</div>';

  // hero
  h+='<div class="hero" style="border-color:'+col+'44;background:rgba('+rgb+',.04)">';
  h+='<div class="hero-label" style="color:'+col+'">'+ph.l+'</div>';
  h+='<div class="hero-name" style="color:'+col+'">'+ph.n+'</div>';
  h+='<div class="hero-months">'+ph.m+'</div>';
  h+='<div class="hero-goal" style="background:rgba('+rgb+',.12);color:'+col+'">🎯 Goal: '+ph.g+'</div>';
  h+='<div class="hero-prog"><div class="pl"><span>Phase: '+phDn+' / '+phTot+' days</span><span>'+phPct+'%</span></div>';
  h+='<div class="bar-wrap" style="height:6px"><div class="bar-fill" style="width:'+phPct+'%;background:'+col+'"></div></div></div></div>';

  // weeks
  h+='<div class="weeks">';
  ph.w.forEach(function(wk,wi){
    var wKey=curPh+'_'+wi;
    var isOpen=!!openW[wKey];
    var wkDn=0;
    wk.d.forEach(function(_,di){if(done[curPh+'_'+wi+'_'+di])wkDn++;});
    var wkPct=wk.d.length?Math.round(wkDn/wk.d.length*100):0;

    h+='<div class="wk">';
    h+='<div class="wk-head" onclick="togW(\''+wKey+'\')">';
    h+='<div>';
    h+='<div class="wk-num" style="color:'+col+'">Week '+(wi+1)+'</div>';
    h+='<div class="wk-title">'+wk.t+'</div>';
    h+='</div>';
    h+='<div style="display:flex;align-items:center;gap:10px">';
    h+='<div class="wk-right"><div class="wk-prog-bar"><div class="wk-prog-fill" style="width:'+wkPct+'%;background:'+col+'"></div></div>';
    h+='<div class="wk-status">'+wkDn+'/'+wk.d.length+' done</div></div>';
    h+='<span class="arrow'+(isOpen?' open':'')+'">▼</span>';
    h+='</div></div>';

    h+='<div class="days'+(isOpen?' open':'')+'">';
    wk.d.forEach(function(d,di){
      var k=curPh+'_'+wi+'_'+di;
      var isDone=!!done[k];
      var isToday=d.day===today;
      var cls='day-card'+(isDone?' done-day':'')+(isToday?' today':'');

      h+='<div class="'+cls+'">';
      h+='<div class="day-top">';
      h+='<span class="day-date">'+d.day+(isToday?'<span class="today-tag">TODAY</span>':'')+'</span>';
      h+='<button class="mark-btn'+(isDone?' done':'')+'" onclick="tog('+curPh+','+wi+','+di+',event)">'+(isDone?'✓ Done':'Mark done')+'</button>';
      h+='</div>';
      h+='<div class="slots">';

      var slots=[
        {lb:'Watch',mn:'20m',bg:'#EEEDFE',tc:'#3C3489',tx:d.w, lk:d.wl,ins:d.wi},
        {lb:'Read', mn:'20m',bg:'#E6F1FB',tc:'#1a4971',tx:d.r, lk:d.rl,ins:d.ri},
        {lb:'Lab',  mn:'35m',bg:'#E1F5EE',tc:'#085041',tx:d.b, lk:d.bl,ins:d.bi},
        {lb:'Notes',mn:'15m',bg:'#FFF3E0',tc:'#633806',tx:d.n, lk:d.nl,ins:d.ni}
      ];

      slots.forEach(function(sl){
        h+='<div class="slot">';
        h+='<span class="sbadge" style="background:'+sl.bg+';color:'+sl.tc+';border-color:'+sl.tc+'33">'+sl.lb+'<br>'+sl.mn+'</span>';
        h+='<div>';
        h+='<div class="slot-title">'+sl.tx+'</div>';
        if(sl.ins) h+='<div class="slot-instr">'+sl.ins+'</div>';
        h+='<a class="slot-link" href="'+sl.lk+'" target="_blank" rel="noopener">Open →</a>';
        h+='</div></div>';
      });

      h+='</div>';
      h+='<div class="day-footer"><span>⏱ 90 min total</span><span>📺 Watch 20m</span><span>📖 Read 20m</span><span>🔬 Lab 35m</span><span>📝 Notes 15m</span></div>';
      h+='</div>';
    });
    h+='</div></div>';
  });
  h+='</div>';

  document.getElementById('app').innerHTML=h;
}

window.addEventListener('load',function(){
  if(window.PH&&window.PH.length){draw();return;}
  var chk=setInterval(function(){
    if(window.PH&&window.PH.length){clearInterval(chk);draw();}
  },100);
  setTimeout(function(){
    clearInterval(chk);
    if(!window.PH||!window.PH.length){
      document.getElementById('app').innerHTML='<div style="padding:30px;color:#dc2626;font-size:13px;text-align:center">Error: data not loaded.<br>p1.js – p6.js must be in the same repo as index.html.<br>Hard refresh: Ctrl+Shift+R</div>';
    }
  },5000);
});
</script>
</body>
</html>
